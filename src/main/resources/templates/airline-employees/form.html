<h1 th:text="${employee.id == null} ? 'Add Airline Employee' : 'Edit Airline Employee'"></h1>
<form th:action="@{/airline-employees/save}" th:object="${employee}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" />

    <label>Role:</label>
    <input type="text" th:field="*{role}" />

    <label>Company:</label>
    <input type="text" th:field="*{company}" />

    <button type="submit">Save</button>
</form>
