<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airline Employee Form</title>
</head>
<body>
<div>
    <h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>
    <form th:action="@{/airline-employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Name:</label>
            <input type="text" th:field="*{name}" required />
        </div>

        <div>
            <label>Role:</label>
            <input type="text" th:field="*{role}" required />
        </div>

        <div>
            <button type="submit">Save</button>
            <a th:href="@{/airline-employees}">Back</a>
        </div>
    </form>
</div>
</body>
</html>
