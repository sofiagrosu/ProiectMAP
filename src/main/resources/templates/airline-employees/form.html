<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airline Employee Form</title>
    <style> .error { color: red; } </style>
</head>
<body>
<div>
    <h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>
    <form th:action="@{/airline-employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Name (inherited from Staff):</label>
            <input type="text" th:field="*{name}" />
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
        </div>
        <br>

        <div>
            <label>Employee Number (required, unique):</label>
            <input type="text" th:field="*{employeeNumber}" />
            <span class="error" th:if="${#fields.hasErrors('employeeNumber')}" th:errors="*{employeeNumber}">Employee Number Error</span>
        </div>
        <br>

        <div>
            <label>Company (required):</label>
            <input type="text" th:field="*{company}" />
            <span class="error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}">Company Error</span>
        </div>
        <br>

        <div>
            <label>Role (required):</label>
            <select th:field="*{role}">
                <option value="">-- Select Role --</option>
                <option th:each="r : ${roles}"
                        th:value="${r}"
                        th:text="${r}">
                    Role
                </option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Role Error</span>
        </div>
        <br>

        <div>
            <button type="submit">Save</button>
            <a th:href="@{/airline-employees}">Back</a>
        </div>
    </form>
</div>
</body>
</html>
