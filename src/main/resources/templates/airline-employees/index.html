<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airline Employees</title>
</head>
<body>
<div>
    <h2>Airline Employees</h2>
    <a th:href="@{/airline-employees/new}">Add New Employee</a>
    <table border="1" cellspacing="0" cellpadding="5">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.role}"></td>
            <td>
                <a th:href="@{|/airline-employees/details/${employee.id}|}">Details</a>
                <a th:href="@{|/airline-employees/edit/${employee.id}|}">Edit</a>
                <a th:href="@{|/airline-employees/delete/${employee.id}|}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
