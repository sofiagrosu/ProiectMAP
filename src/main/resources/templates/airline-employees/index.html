<h1>Airline Employees</h1>
<a th:href="@{/airline-employees/new}">Add New Employee</a>
<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Role</th>
        <th>Company</th>
        <th>Actions</th>
    </tr>
    <tr th:each="ae : ${employees}">
        <td th:text="${ae.id}"></td>
        <td th:text="${ae.name}"></td>
        <td th:text="${ae.role}"></td>
        <td th:text="${ae.company}"></td>
        <td>
            <a th:href="@{/airline-employees/edit/{id}(id=${ae.id})}">Edit</a>
            <a th:href="@{/airline-employees/delete/{id}(id=${ae.id})}">Delete</a>
            <a th:href="@{/airline-employees/details/{id}(id=${ae.id})}">Details</a>
        </td>
    </tr>
</table>
