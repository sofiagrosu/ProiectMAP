<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${airplane.id == null ? 'Add Airplane' : 'Edit Airplane'}">Airplane Form</title>
</head>
<body>
<h2 th:text="${airplane.id == null ? 'Add Airplane' : 'Edit Airplane'}"></h2>

<form th:action="@{/airplanes/save}" th:object="${airplane}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Number:</label>
        <input type="number" th:field="*{number}" required/>
    </div>

    <div>
        <button type="submit">Save</button>
        <a th:href="@{/airplanes}">Back</a>
    </div>
</form>
</body>
</html>
