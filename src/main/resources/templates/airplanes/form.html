<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airplane Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">
            <span th:text="${airplane.id} ? 'Edit Airplane' : 'Create New Airplane'"></span>
        </div>

        <div class="content-grid">

            <!-- STÂNGA: formular -->
            <div class="side-area">

                <div class="side-block">
                    <div class="side-header">AIRPLANE FORM</div>

                    <div class="side-body">
                        <form th:action="@{/airplanes/save}"
                              th:object="${airplane}"
                              method="post"
                              class="form-stack">

                            <input type="hidden" th:field="*{id}" />

                            <!-- Airplane Number -->
                            <div>
                                <label class="lbl" for="number">Airplane Number</label>
                                <input class="input"
                                       type="number"
                                       id="number"
                                       th:field="*{number}"
                                       placeholder="e.g. 101" />
                                <span class="error"
                                      th:if="${#fields.hasErrors('number')}"
                                      th:errors="*{number}">
                                    Number Error
                                </span>
                            </div>

                            <div class="side-actions">
                                <a class="btn btn-back" th:href="@{/airplanes}">Cancel</a>
                                <button class="btn btn-primary" type="submit">Save</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>

            <!-- DREAPTA: spațiu liber -->
            <div class="table-area"></div>
        </div>

    </div>
</div>
</body>
</html>
