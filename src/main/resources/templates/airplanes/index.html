<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Airplanes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">Airplanes</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/airplanes/new}">Create New Airplane</a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Number</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="a : ${airplanes}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${a.number}"></td>

                        <td><a class="link" th:href="@{/airplanes/details/{id}(id=${a.id})}">Details</a></td>
                        <td><a class="link" th:href="@{/airplanes/edit/{id}(id=${a.id})}">Edit</a></td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/airplanes/delete/{id}(id=${a.id})}"
                               onclick="return confirm('Are you sure you want to delete this airplane?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(airplanes)}">
                        <td colspan="5" class="empty">No airplanes found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/airplanes(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           numberMin=${filter.numberMin},
                           numberMax=${filter.numberMax}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/airplanes(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           numberMin=${filter.numberMin},
                           numberMax=${filter.numberMax}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/airplanes}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="numberMin" th:value="${filter.numberMin}"/>
                            <input type="hidden" name="numberMax" th:value="${filter.numberMax}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="number" th:selected="${sortBy == 'number'}">Number</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/airplanes}" method="get" th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Number min</label>
                                <input class="input" type="number" th:field="*{numberMin}" min="1"/>
                            </div>

                            <div>
                                <label class="lbl">Number max</label>
                                <input class="input" type="number" th:field="*{numberMax}" min="1"/>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/airplanes(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
</body>
</html>
