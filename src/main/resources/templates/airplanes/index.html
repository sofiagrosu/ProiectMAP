<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airplane List</title>
</head>
<body>

<h2>Airplane List</h2>
<a th:href="@{/airplanes/new}">Create New Airplane</a>
<form th:action="@{/airplanes}" method="get">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label>Sort by:</label>
    <select name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="number" th:selected="${sortBy == 'number'}">Number</option>
    </select>

    <label>Order:</label>
    <select name="ascending">
        <option value="true" th:selected="${ascending}">Ascending</option>
        <option value="false" th:selected="${!ascending}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Number</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="airplane : ${airplanes}">
        <td th:text="${airplane.id}"></td>
        <td th:text="${airplane.number}"></td>
        <td>
            <a th:href="@{/airplanes/details/{id}(id=${airplane.id})}">Details</a> |
            <a th:href="@{/airplanes/edit/{id}(id=${airplane.id})}">Edit</a> |
            <a th:href="@{/airplanes/delete/{id}(id=${airplane.id})}" onclick="return confirm('Are you sure you want to delete this airplane?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
