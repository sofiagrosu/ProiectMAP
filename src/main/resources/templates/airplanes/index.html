<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airplanes</title>
</head>
<body>

<h2>Airplanes</h2>
<a th:href="@{/airplanes/new}">Create New Airplane</a>

<hr/>

<!-- ===================== FILTER FORM ===================== -->
<h3>Filters</h3>
<form th:action="@{/airplanes}" method="get" th:object="${filter}">

    <div>
        <label>Number min</label>
        <input type="number" th:field="*{numberMin}" min="1"/>
    </div>

    <div>
        <label>Number max</label>
        <input type="number" th:field="*{numberMax}" min="1"/>
    </div>

    <!-- păstrăm sortarea -->
    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
    <input type="hidden" name="ascending" th:value="${ascending}"/>
    <input type="hidden" name="size" th:value="${page.size}"/>
    <input type="hidden" name="page" value="0"/>

    <button type="submit">Apply filters</button>

    <a th:href="@{/airplanes(
            page=0,
            size=${page.size},
            sortBy=${sortBy},
            ascending=${ascending}
        )}">
        Reset filters
    </a>
</form>

<hr/>

<!-- ===================== SORT FORM ===================== -->
<h3>Sort</h3>
<form th:action="@{/airplanes}" method="get">

    <!-- păstrăm filtrele -->
    <input type="hidden" name="numberMin" th:value="${filter.numberMin}"/>
    <input type="hidden" name="numberMax" th:value="${filter.numberMax}"/>

    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label>Sort by:</label>
    <select name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="number" th:selected="${sortBy == 'number'}">Number</option>
    </select>

    <label>Direction:</label>
    <select name="ascending">
        <option value="true" th:selected="${ascending}">Ascending</option>
        <option value="false" th:selected="${!ascending}">Descending</option>
    </select>

    <button type="submit">Apply sort</button>
</form>

<hr/>

<!-- ===================== TABLE ===================== -->
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Number</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${airplanes}">
        <td th:text="${a.id}"></td>
        <td th:text="${a.number}"></td>
        <td>
            <a th:href="@{/airplanes/details/{id}(id=${a.id})}">Details</a> |
            <a th:href="@{/airplanes/edit/{id}(id=${a.id})}">Edit</a> |
            <a th:href="@{/airplanes/delete/{id}(id=${a.id})}"
               onclick="return confirm('Are you sure you want to delete this airplane?');">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ===================== PAGINATION ===================== -->
<div>
    <a th:if="${page.hasPrevious()}"
       th:href="@{/airplanes(
           page=${page.number - 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           numberMin=${filter.numberMin},
           numberMax=${filter.numberMax}
       )}">
        Prev
    </a>

    <span th:text="${page.number + 1}"></span>
    /
    <span th:text="${page.totalPages}"></span>

    <a th:if="${page.hasNext()}"
       th:href="@{/airplanes(
           page=${page.number + 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           numberMin=${filter.numberMin},
           numberMax=${filter.numberMax}
       )}">
        Next
    </a>
</div>

</body>
</html>
