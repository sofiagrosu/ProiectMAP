<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airport Employee Form</title>
</head>
<body>
<h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>

<form th:action="@{/airport-employees/save}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}" required/>
    </div>

    <div>
        <label>Department:</label>
        <input type="text" th:field="*{department}" required/>
    </div>

    <div>
        <label>Designation:</label>
        <input type="text" th:field="*{designation}" required/>
    </div>

    <div>
        <button type="submit">Save</button>
        <a th:href="@{/airport-employees}">Back</a>
    </div>
</form>
</body>
</html>
