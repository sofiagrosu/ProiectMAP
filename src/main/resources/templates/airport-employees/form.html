<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airport Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">
            <span th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></span>
        </div>

        <div class="content-grid">

            <!-- STÂNGA: formular -->
            <div class="side-area">

                <div class="side-block">
                    <div class="side-header">AIRPORT EMPLOYEE FORM</div>

                    <div class="side-body">
                        <form th:action="@{/airport-employees/save}"
                              th:object="${employee}"
                              method="post"
                              class="form-stack">

                            <input type="hidden" th:field="*{id}"/>

                            <div>
                                <label class="lbl">Name</label>
                                <input class="input" type="text" th:field="*{name}" placeholder="e.g. John Smith"/>
                                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
                            </div>

                            <div>
                                <label class="lbl">Employee Number</label>
                                <input class="input" type="text" th:field="*{employeeNumber}" placeholder="e.g. AEMP-102"/>
                                <span class="error" th:if="${#fields.hasErrors('employeeNumber')}" th:errors="*{employeeNumber}">Number Error</span>
                            </div>

                            <div>
                                <label class="lbl">Department</label>
                                <input class="input" type="text" th:field="*{department}" placeholder="e.g. Operations"/>
                                <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">Department Error</span>
                            </div>

                            <div>
                                <label class="lbl">Designation</label>
                                <input class="input" type="text" th:field="*{designation}" placeholder="e.g. Supervisor"/>
                                <span class="error" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}">Designation Error</span>
                            </div>

                            <div class="side-actions">
                                <a class="btn btn-back" th:href="@{/airport-employees}">Back</a>
                                <button class="btn btn-primary" type="submit">Save</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>

            <!-- DREAPTA: spațiu liber -->
            <div class="table-area"></div>
        </div>

    </div>
</div>
</body>
</html>
