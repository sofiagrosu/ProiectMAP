<h1 th:text="${employee.id == null} ? 'Add Airport Employee' : 'Edit Airport Employee'"></h1>
<form th:action="@{/airport-employees/save}" th:object="${employee}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" />

    <label>Department:</label>
    <input type="text" th:field="*{department}" />

    <label>Designation:</label>
    <input type="text" th:field="*{designation}" />

    <button type="submit">Save</button>
</form>
