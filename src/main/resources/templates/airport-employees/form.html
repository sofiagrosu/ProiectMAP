<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airport Employee Form</title>
    <style> .error { color: red; } </style>
</head>
<body>
<h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>

<form th:action="@{/airport-employees/save}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Name (required):</label>
        <input type="text" th:field="*{name}"/>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
    </div>
    <br/>

    <div>
        <label>Employee Number (required, unique):</label>
        <input type="text" th:field="*{employeeNumber}"/>
        <span class="error" th:if="${#fields.hasErrors('employeeNumber')}" th:errors="*{employeeNumber}">Number Error</span>
    </div>
    <br/>

    <div>
        <label>Department (required):</label>
        <input type="text" th:field="*{department}"/>
        <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">Department Error</span>
    </div>
    <br/>

    <div>
        <label>Designation (required):</label>
        <input type="text" th:field="*{designation}"/>
        <span class="error" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}">Designation Error</span>
    </div>
    <br/>

    <div>
        <button type="submit">Save</button>
        <a th:href="@{/airport-employees}">Back</a>
    </div>
</form>
</body>
</html>
