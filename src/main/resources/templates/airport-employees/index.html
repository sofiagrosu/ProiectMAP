<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Airport Employee List</title>
</head>
<body>

<h2>Airport Employee List</h2>
<a th:href="@{/airport-employees/new}">Create New Employee</a>

<hr/>

<!-- ===================== FILTER FORM ===================== -->
<h3>Filters</h3>
<form th:action="@{/airport-employees}" method="get" th:object="${filter}">

    <div>
        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Employee name"/>
    </div>

    <div>
        <label>Department</label>
        <input type="text" th:field="*{department}" placeholder="Department"/>
    </div>

    <div>
        <label>Designation</label>
        <input type="text" th:field="*{designation}" placeholder="Designation"/>
    </div>

    <div>
        <label>Employee Number</label>
        <input type="text" th:field="*{employeeNumber}" placeholder="Employee number"/>
    </div>

    <!-- păstrăm sortarea -->
    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
    <input type="hidden" name="ascending" th:value="${ascending}"/>
    <input type="hidden" name="size" th:value="${page.size}"/>
    <input type="hidden" name="page" value="0"/>

    <button type="submit">Apply filters</button>

    <a th:href="@{/airport-employees(
            page=0,
            size=${page.size},
            sortBy=${sortBy},
            ascending=${ascending}
        )}">
        Reset filters
    </a>
</form>

<hr/>

<!-- ===================== SORT FORM ===================== -->
<h3>Sort</h3>
<form th:action="@{/airport-employees}" method="get">

    <!-- păstrăm filtrele -->
    <input type="hidden" name="name" th:value="${filter.name}"/>
    <input type="hidden" name="department" th:value="${filter.department}"/>
    <input type="hidden" name="designation" th:value="${filter.designation}"/>
    <input type="hidden" name="employeeNumber" th:value="${filter.employeeNumber}"/>

    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label>Sort by:</label>
    <select name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="name" th:selected="${sortBy == 'name'}">Name</option>
        <option value="department" th:selected="${sortBy == 'department'}">Department</option>
        <option value="designation" th:selected="${sortBy == 'designation'}">Designation</option>
        <option value="employeeNumber" th:selected="${sortBy == 'employeeNumber'}">Employee Number</option>
    </select>

    <label>Direction:</label>
    <select name="ascending">
        <option value="true" th:selected="${ascending}">Ascending</option>
        <option value="false" th:selected="${!ascending}">Descending</option>
    </select>

    <button type="submit">Apply sort</button>
</form>

<hr/>

<!-- ===================== TABLE ===================== -->
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Employee Number</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.name}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${e.designation}"></td>
        <td th:text="${e.employeeNumber}"></td>
        <td>
            <a th:href="@{/airport-employees/details/{id}(id=${e.id})}">Details</a> |
            <a th:href="@{/airport-employees/edit/{id}(id=${e.id})}">Edit</a> |
            <a th:href="@{/airport-employees/delete/{id}(id=${e.id})}"
               onclick="return confirm('Are you sure you want to delete this employee?');">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ===================== PAGINATION ===================== -->
<div>
    <a th:if="${page.hasPrevious()}"
       th:href="@{/airport-employees(
           page=${page.number - 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           name=${filter.name},
           department=${filter.department},
           designation=${filter.designation},
           employeeNumber=${filter.employeeNumber}
       )}">
        Prev
    </a>

    <span th:text="${page.number + 1}"></span>
    /
    <span th:text="${page.totalPages}"></span>

    <a th:if="${page.hasNext()}"
       th:href="@{/airport-employees(
           page=${page.number + 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           name=${filter.name},
           department=${filter.department},
           designation=${filter.designation},
           employeeNumber=${filter.employeeNumber}
       )}">
        Next
    </a>
</div>

</body>
</html>
