<h1>Airport Employees</h1>
<a th:href="@{/airport-employees/new}">Add New Employee</a>
<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Actions</th>
    </tr>
    <tr th:each="ae : ${employees}">
        <td th:text="${ae.id}"></td>
        <td th:text="${ae.name}"></td>
        <td th:text="${ae.department}"></td>
        <td th:text="${ae.designation}"></td>
        <td>
            <a th:href="@{/airport-employees/edit/{id}(id=${ae.id})}">Edit</a>
            <a th:href="@{/airport-employees/delete/{id}(id=${ae.id})}">Delete</a>
            <a th:href="@{/airport-employees/details/{id}(id=${ae.id})}">Details</a>
        </td>
    </tr>
</table>
