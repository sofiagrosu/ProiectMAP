<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airport Employees</title>
</head>
<body>
<h2>Airport Employees</h2>

<a th:href="@{/airport-employees/new}">Add New Employee</a>
<form th:action="@{/airport-employees}" method="get">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="name" th:selected="${sortBy == 'name'}">Name</option>
        <option value="departament" th:selected="${sortBy == 'departament'}">Departament</option>
        <option value="designation" th:selected="${sortBy == 'designation'}">Designation</option>
        <option value="number" th:selected="${sortBy == 'number'}">Number</option>
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true" th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.name}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${e.designation}"></td>
        <td>
            <a th:href="@{|/airport-employees/details/${e.id}|}">Details</a> |
            <a th:href="@{|/airport-employees/edit/${e.id}|}">Edit</a> |
            <a th:href="@{|/airport-employees/delete/${e.id}|}" onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/flights}">Back to Flights</a>
</body>
</html>
