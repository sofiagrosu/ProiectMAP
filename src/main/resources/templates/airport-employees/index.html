<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Airport Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">Airport Employees</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/airport-employees/new}">Create New Employee</a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Employee Number</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody th:with="list=${employees} ?: ${airportEmployees}">
                    <tr th:each="e : ${list}">
                        <td th:text="${e.id}"></td>
                        <td th:text="${e.name}"></td>
                        <td th:text="${e.department}"></td>
                        <td th:text="${e.designation}"></td>
                        <td th:text="${e.employeeNumber}"></td>

                        <td><a class="link" th:href="@{/airport-employees/details/{id}(id=${e.id})}">Details</a></td>
                        <td><a class="link" th:href="@{/airport-employees/edit/{id}(id=${e.id})}">Edit</a></td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/airport-employees/delete/{id}(id=${e.id})}"
                               onclick="return confirm('Are you sure you want to delete this employee?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(list)}">
                        <td colspan="8" class="empty">No employees found.</td>
                    </tr>
                    </tbody>

                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/airport-employees(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           name=${filter.name},
                           department=${filter.department},
                           designation=${filter.designation},
                           employeeNumber=${filter.employeeNumber}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/airport-employees(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           name=${filter.name},
                           department=${filter.department},
                           designation=${filter.designation},
                           employeeNumber=${filter.employeeNumber}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/airport-employees}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="name" th:value="${filter.name}"/>
                            <input type="hidden" name="department" th:value="${filter.department}"/>
                            <input type="hidden" name="designation" th:value="${filter.designation}"/>
                            <input type="hidden" name="employeeNumber" th:value="${filter.employeeNumber}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Name</option>
                                <option value="department" th:selected="${sortBy == 'department'}">Department</option>
                                <option value="designation" th:selected="${sortBy == 'designation'}">Designation</option>
                                <option value="employeeNumber" th:selected="${sortBy == 'employeeNumber'}">Employee Number</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/airport-employees}" method="get" th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Name</label>
                                <input class="input" type="text" th:field="*{name}" placeholder="Employee name"/>
                            </div>

                            <div>
                                <label class="lbl">Department</label>
                                <input class="input" type="text" th:field="*{department}" placeholder="Department"/>
                            </div>

                            <div>
                                <label class="lbl">Designation</label>
                                <input class="input" type="text" th:field="*{designation}" placeholder="Designation"/>
                            </div>

                            <div>
                                <label class="lbl">Employee Number</label>
                                <input class="input" type="text" th:field="*{employeeNumber}" placeholder="Employee number"/>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/airport-employees(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
