<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Assignment Form</title>
    <style> .error { color: red; } </style>
</head>
<body>

<h2><span th:text="${assignment.id} ? 'Edit Assignment' : 'Create New Assignment'"></span></h2>

<form th:action="@{/assignments/save}" th:object="${assignment}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="assignmentDate">Assignment Date (required):</label>
        <input type="date" id="assignmentDate" th:field="*{assignmentDate}" />
        <span class="error"
              th:if="${#fields.hasErrors('assignmentDate')}"
              th:errors="*{assignmentDate}">
            Date Error
        </span>
    </div>
    <br/>

    <div>
        <label for="flightId">Flight (required):</label>
        <select id="flightId" name="flightId">
            <option value="">-- Select Flight --</option>
            <option th:each="f : ${flights}"
                    th:value="${f.id}"
                    th:text="${f.name}"
                    th:selected="${assignment.flight != null and assignment.flight.id == f.id}">
                Flight
            </option>
        </select>

        <span class="error"
              th:if="${#fields.hasErrors('flight')}"
              th:errors="*{flight}">
            Flight Selection Error
        </span>
    </div>
    <br/>

    <div>
        <label for="staffId">Staff Member (required):</label>
        <select id="staffId" name="staffId">
            <option value="">-- Select Staff Member --</option>
            <option th:each="s : ${staff}"
                    th:value="${s.id}"
                    th:text="${s.name}"
                    th:selected="${assignment.staff != null and assignment.staff.id == s.id}">
                Staff
            </option>
        </select>

        <span class="error"
              th:if="${#fields.hasErrors('staff')}"
              th:errors="*{staff}">
            Staff Selection Error
        </span>
    </div>
    <br/>

    <button type="submit">Save</button>
    <a th:href="@{/assignments}">Cancel</a>
</form>
</body>
</html>
