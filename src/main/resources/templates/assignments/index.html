<h1>Flight Assignments</h1>
<a th:href="@{/assignments/new}">Add New Assignment</a>
<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Staff</th>
        <th>Assignment Date</th>
        <th>Actions</th>
    </tr>
    <tr th:each="fa : ${assignments}">
        <td th:text="${fa.id}"></td>
        <td th:text="${fa.flightId}"></td>
        <td th:text="${fa.staffId}"></td>
        <td th:text="${fa.assigmentDate}"></td>
        <td>
            <a th:href="@{/assignments/edit/{id}(id=${fa.id})}">Edit</a>
            <a th:href="@{/assignments/delete/{id}(id=${fa.id})}">Delete</a>
            <a th:href="@{/assignments/details/{id}(id=${fa.id})}">Details</a>
        </td>
    </tr>
</table>
