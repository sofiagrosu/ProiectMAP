<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Assignments List</title>
</head>
<body>

<h2>Flight Assignments List</h2>
<a th:href="@{/assignments/new}">Create New Assignment</a>
<form th:action="@{/assignments}" method="get">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="flight" th:selected="${sortBy == 'flight'}">Flight</option>
        <option value="staff" th:selected="${sortBy == 'staff'}">Staff</option>
        <option value="assignmentDate" th:selected="${sortBy == 'assignmentDate'}">Date</option>
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true" th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Staff Member</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.flight.name}"></td>
        <td th:text="${assignment.staff.name}"></td>
        <td th:text="${assignment.assignmentDate}"></td>
        <td>
            <a th:href="@{/assignments/details/{id}(id=${assignment.id})}">Details</a> |
            <a th:href="@{/assignments/edit/{id}(id=${assignment.id})}">Edit</a> |
            <a th:href="@{/assignments/delete/{id}(id=${assignment.id})}" onclick="return confirm('Are you sure you want to delete this assignment?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
