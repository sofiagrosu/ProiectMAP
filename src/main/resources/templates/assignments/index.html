<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Assignments List</title>
</head>
<body>

<h2>Flight Assignments List</h2>
<a th:href="@{/assignments/new}">Create New Assignment</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Staff Member</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.flight.name}"></td>
        <td th:text="${assignment.staff.name}"></td>
        <td th:text="${assignment.assignmentDate}"></td>
        <td>
            <a th:href="@{/assignments/details/{id}(id=${assignment.id})}">Details</a> |
            <a th:href="@{/assignments/edit/{id}(id=${assignment.id})}">Edit</a> |
            <a th:href="@{/assignments/delete/{id}(id=${assignment.id})}" onclick="return confirm('Are you sure you want to delete this assignment?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
