<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Luggage Form</title>
    <style> .error { color: red; } </style>
</head>
<body>

<h2><span th:text="${luggage.id} ? 'Edit Luggage' : 'Create New Luggage'"></span></h2>

<form th:action="@{/luggages/save}" th:object="${luggage}" method="post">
    <input type="hidden" th:field="*{id}" />

    <!-- Many-to-One Relationship: Ticket (@NotNull validation) -->
    <div>
        <label for="ticketId">Associated Ticket (required):</label>
        <select id="ticketId" name="ticketId">
            <option value="">-- Select Ticket --</option>
            <!-- Th:selected relies on the dummy object ID set in the Controller on error -->
            <option th:each="t : ${tickets}"
                    th:value="${t.id}"
                    th:text="${'ID: ' + t.id + ' (Flight: ' + t.flight.name + ')'}"
                    th:selected="${luggage.ticket?.id == t.id}">
                Ticket
            </option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('ticket')}" th:errors="*{ticket}">Ticket Selection Error</span>
    </div>
    <br/>

    <!-- Status Field (@NotNull validation) -->
    <div>
        <label for="status">Status (required):</label>
        <select id="status" th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
                Status
            </option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Status Error</span>
    </div>
    <br/>

    <button type="submit">Save</button>
    <a th:href="@{/luggages}">Cancel</a>
</form>
</body>
</html>
