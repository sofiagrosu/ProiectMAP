<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Luggage Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">
            <span th:text="${luggage.id} ? 'Edit Luggage' : 'Create new Luggage'"></span>
        </div>

        <div class="content-grid">

            <!-- STÂNGA: formular -->
            <div class="side-area">

                <div class="side-block">
                    <div class="side-header">LUGGAGE FORM</div>

                    <div class="side-body">
                        <form th:action="@{/luggages/save}" th:object="${luggage}" method="post" class="form-stack">
                            <input type="hidden" th:field="*{id}" />

                            <!-- Ticket: TEXT by ID -->
                            <div>
                                <label class="lbl" for="ticketId">Associated Ticket ID (required)</label>
                                <input class="input"
                                       type="text"
                                       id="ticketId"
                                       name="ticketId"
                                       th:value="${luggage.ticket?.id}"
                                       placeholder="e.g. 1" />
                                <span class="error" th:if="${#fields.hasErrors('ticket')}" th:errors="*{ticket}">
                                    Ticket Error
                                </span>
                            </div>

                            <!-- Status (rămâne dropdown, dar stilizat) -->
                            <div>
                                <label class="lbl" for="status">Status (required)</label>
                                <select class="input" id="status" th:field="*{status}">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s}">
                                        Status
                                    </option>
                                </select>
                                <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                                    Status Error
                                </span>
                            </div>

                            <div class="side-actions">
                                <a class="btn btn-back" th:href="@{/luggages}">Cancel</a>
                                <button class="btn btn-primary" type="submit">Save</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>

            <!-- DREAPTA: spațiu liber -->
            <div class="table-area"></div>
        </div>

    </div>
</div>
</body>
</html>
