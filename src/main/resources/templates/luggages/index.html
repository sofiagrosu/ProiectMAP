<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Luggage List</title>
</head>
<body>

<h2>Luggage List</h2>
<a th:href="@{/luggages/new}">Create New Luggage</a>
<form th:action="@{/luggages}" method="get">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="ticket" th:selected="${sortBy == 'ticket'}">Ticket</option>
        <option value="status" th:selected="${sortBy == 'status'}">Status</option>
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true" th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Ticket ID</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="luggage : ${luggages}">
        <td th:text="${luggage.id}"></td>
        <td th:text="${luggage.ticket.id}"></td>
        <td th:text="${luggage.status}"></td>
        <td>
            <a th:href="@{/luggages/details/{id}(id=${luggage.id})}">Details</a> |
            <a th:href="@{/luggages/edit/{id}(id=${luggage.id})}">Edit</a> |
            <a th:href="@{/luggages/delete/{id}(id=${luggage.id})}" onclick="return confirm('Are you sure you want to delete this luggage?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
