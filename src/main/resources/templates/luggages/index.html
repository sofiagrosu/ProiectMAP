<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Luggages</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">Luggages</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/luggages/new}">
                        Create New Luggage
                    </a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ticket ID</th>
                        <th>Status</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="l : ${luggages}">
                        <td th:text="${l.id}"></td>
                        <td th:text="${l.ticket != null ? l.ticket.id : '-'}"></td>
                        <td th:text="${l.status}"></td>

                        <td><a class="link" th:href="@{/luggages/details/{id}(id=${l.id})}">Details</a></td>
                        <td><a class="link" th:href="@{/luggages/edit/{id}(id=${l.id})}">Edit</a></td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/luggages/delete/{id}(id=${l.id})}"
                               onclick="return confirm('Are you sure you want to delete this luggage?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(luggages)}">
                        <td colspan="6" class="empty">No luggages found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/luggages(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           ticketId=${filter.ticketId},
                           status=${filter.status}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/luggages(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           ticketId=${filter.ticketId},
                           status=${filter.status}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/luggages}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="ticketId" th:value="${filter.ticketId}"/>
                            <input type="hidden" name="status" th:value="${filter.status}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="ticket" th:selected="${sortBy == 'ticket'}">Ticket ID</option>
                                <option value="status" th:selected="${sortBy == 'status'}">Status</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/luggages}" method="get"
                              th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Ticket ID</label>
                                <input class="input" type="number" th:field="*{ticketId}"
                                       min="1" placeholder="e.g. 10"/>
                            </div>

                            <div>
                                <label class="lbl">Status</label>
                                <select class="input" th:field="*{status}">
                                    <option value="">All</option>
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s}">
                                    </option>
                                </select>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/luggages(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
