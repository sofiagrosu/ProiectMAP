<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Form</title>
    <!-- pune aici exact path-ul tău către css -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <!-- Titlu tip “pill” ca în list page -->
        <div class="pill-title">
            <span th:text="${flight.id} ? 'Edit Flight' : 'Create new Flight'"></span>
        </div>

        <!-- Layout cu grid: stânga liber, dreapta “side-area” (exact ca la list page) -->
        <div class="content-grid">

            <!-- STÂNGA: formular -->
            <div class="side-area">

                <div class="side-block">
                    <div class="side-header">FLIGHT FORM</div>

                    <div class="side-body">
                        <form th:action="@{/flights/save}" th:object="${flight}" method="post" class="form-stack">

                            <input type="hidden" th:field="*{id}"/>

                            <div>
                                <label class="lbl" for="name">Flight Name</label>
                                <input class="input" type="text" id="name" th:field="*{name}" placeholder="Placeholder"/>
                                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                            </div>

                            <div>
                                <label class="lbl" for="gateNumber">Gate Number</label>
                                <input class="input" type="text" id="gateNumber" th:field="*{gateNumber}" placeholder="Placeholder"/>
                                <span class="error" th:if="${#fields.hasErrors('gateNumber')}" th:errors="*{gateNumber}"></span>
                            </div>

                            <div>
                                <label class="lbl" for="airplaneNumber">Airplane Number</label>
                                <input class="input"
                                       type="text"
                                       id="airplaneNumber"
                                       name="airplaneNumber"
                                       th:value="${flight.airplane?.number}"
                                       placeholder="e.g. YR-ABC"/>
                                <span class="error" th:if="${#fields.hasErrors('airplane')}" th:errors="*{airplane}"></span>
                            </div>

                            <div>
                                <label class="lbl" for="noticeBoardId">Notice Board ID</label>
                                <input class="input"
                                       type="text"
                                       id="noticeBoardId"
                                       name="noticeBoardId"
                                       th:value="${flight.noticeBoard?.id}"
                                       placeholder="e.g. 1"/>
                                <span class="error" th:if="${#fields.hasErrors('noticeBoard')}" th:errors="*{noticeBoard}"></span>
                            </div>

                            <div class="side-actions">
                                <a class="btn btn-back" th:href="@{/flights}">Cancel</a>
                                <button class="btn btn-primary" type="submit">Save</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>

            <!-- DREAPTA: spațiu liber (rămâne gol) -->
            <div class="table-area"></div>

        </div>


    </div>
</div>
</body>
</html>
