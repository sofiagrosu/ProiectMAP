<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${flight.id == null ? 'Add Flight' : 'Edit Flight'}">Flight Form</title>
</head>
<body>
<h2 th:text="${flight.id == null ? 'Add Flight' : 'Edit Flight'}"></h2>

<form th:action="@{/flights/save}" th:object="${flight}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}" required/>
    </div>

    <div>
        <label>Gate Number:</label>
        <input type="text" th:field="*{gateNumber}" required/>
    </div>

    <div>
        <button type="submit">Save</button>
        <a th:href="@{/flights}">Back</a>
    </div>
</form>

</body>
</html>
