<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Flights</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <!-- Title pill -->
        <div class="pill-title">Flights</div>

        <div class="content-grid">
            <!-- LEFT: Table area -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/flights/new}">Create New Flight</a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Airplane</th>
                        <th>Gate</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="flight : ${flights}">
                        <td th:text="${flight.id}"></td>
                        <td th:text="${flight.name}"></td>
                        <td th:text="${flight.airplane != null ? flight.airplane.number : '-'}"></td>
                        <td th:text="${flight.gateNumber}"></td>

                        <td><a class="link" th:href="@{/flights/details/{id}(id=${flight.id})}">Details</a></td>
                        <td><a class="link" th:href="@{/flights/edit/{id}(id=${flight.id})}">Edit</a></td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/flights/delete/{id}(id=${flight.id})}"
                               onclick="return confirm('Are you sure you want to delete this flight?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <!-- (opțional) rânduri goale ca să păstrezi „grila” ca în mockup -->
                    <tr th:if="${#lists.isEmpty(flights)}">
                        <td colspan="7" class="empty">No flights found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <div class="pagination">
                    <a class="link"
                       th:if="${page.hasPrevious()}"
                       th:href="@{/flights(
                           page=${page.number - 1}, size=${page.size},
                           sortBy=${sortBy}, ascending=${ascending},
                           name=${filter.name}, gateNumber=${filter.gateNumber},
                           airplaneId=${filter.airplaneId}, noticeBoardId=${filter.noticeBoardId}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link"
                       th:if="${page.hasNext()}"
                       th:href="@{/flights(
                           page=${page.number + 1}, size=${page.size},
                           sortBy=${sortBy}, ascending=${ascending},
                           name=${filter.name}, gateNumber=${filter.gateNumber},
                           airplaneId=${filter.airplaneId}, noticeBoardId=${filter.noticeBoardId}
                       )}">
                        Next
                    </a>
                </div>

                <!-- Back bottom-left -->
                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Side panels -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/flights}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="name" th:value="${filter.name}"/>
                            <input type="hidden" name="gateNumber" th:value="${filter.gateNumber}"/>
                            <input type="hidden" name="airplaneId" th:value="${filter.airplaneId}"/>
                            <input type="hidden" name="noticeBoardId" th:value="${filter.noticeBoardId}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Name</option>
                                <option value="gateNumber" th:selected="${sortBy == 'gateNumber'}">Gate</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/flights}" method="get" th:object="${filter}" class="form-stack">
                            <div>
                                <label class="lbl">Name</label>
                                <input class="input" type="text" th:field="*{name}" placeholder="Flight name"/>
                            </div>

                            <div>
                                <label class="lbl">Gate</label>
                                <input class="input" type="text" th:field="*{gateNumber}" placeholder="Gate number"/>
                            </div>

                            <div>
                                <label class="lbl">Airplane</label>
                                <select class="input" th:field="*{airplaneId}">
                                    <option value="">All</option>
                                    <option th:each="a : ${airplanes}"
                                            th:value="${a.id}"
                                            th:text="${a.number}">
                                    </option>
                                </select>
                            </div>

                            <div>
                                <label class="lbl">NoticeBoard</label>
                                <select class="input" th:field="*{noticeBoardId}">
                                    <option value="">All</option>
                                    <option th:each="n : ${noticeboards}"
                                            th:value="${n.id}"
                                            th:text="${n.id}">
                                    </option>
                                </select>
                            </div>

                            <!-- keep sort + size -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/flights(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
