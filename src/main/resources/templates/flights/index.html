<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight List</title>
</head>
<body>
<form th:action="@{/flights}" method="get">
    <!-- păstrează pagina 0 când schimbi sortarea -->
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page != null ? page.size : 5}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="name" th:selected="${sortBy == 'name'}">Name</option>
        <option value="gateNumber" th:selected="${sortBy == 'gateNumber'}">Gate</option>
        <!-- adaugă aici și alte câmpuri existente în Flight -->
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true"  th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>
<h2>Flight List</h2>
<a th:href="@{/flights/new}">Create New Flight</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Airplane ID</th>
        <th>Gate</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="flight : ${flights}">
        <td th:text="${flight.id}"></td>
        <td th:text="${flight.name}"></td>
        <td th:text="${flight.airplane.id}"></td>
        <td th:text="${flight.gateNumber}"></td>
        <td>
            <a th:href="@{/flights/details/{id}(id=${flight.id})}">Details</a> |
            <a th:href="@{/flights/edit/{id}(id=${flight.id})}">Edit</a> |
            <a th:href="@{/flights/delete/{id}(id=${flight.id})}" onclick="return confirm('Are you sure you want to delete this flight?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
