<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Passengers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">Passengers</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/passengers/new}">
                        Create New Passenger
                    </a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Currency</th>
                        <th>Checked In</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="p : ${passengers}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.currency}"></td>
                        <td th:text="${p.checkedIn ? 'Yes' : 'No'}"></td>

                        <td>
                            <a class="link" th:href="@{/passengers/details/{id}(id=${p.id})}">
                                Details
                            </a>
                        </td>
                        <td>
                            <a class="link" th:href="@{/passengers/edit/{id}(id=${p.id})}">
                                Edit
                            </a>
                        </td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/passengers/delete/{id}(id=${p.id})}"
                               onclick="return confirm('Are you sure you want to delete this passenger?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(passengers)}">
                        <td colspan="7" class="empty">No passengers found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/passengers(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           name=${filter.name},
                           currency=${filter.currency},
                           checkedIn=${filter.checkedIn}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/passengers(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           name=${filter.name},
                           currency=${filter.currency},
                           checkedIn=${filter.checkedIn}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/passengers}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="name" th:value="${filter.name}"/>
                            <input type="hidden" name="currency" th:value="${filter.currency}"/>
                            <input type="hidden" name="checkedIn" th:value="${filter.checkedIn}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Name</option>
                                <option value="currency" th:selected="${sortBy == 'currency'}">Currency</option>
                                <option value="isCheckedIn" th:selected="${sortBy == 'isCheckedIn'}">Checked In</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/passengers}" method="get"
                              th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Name</label>
                                <input class="input" type="text" th:field="*{name}" placeholder="Passenger name"/>
                            </div>

                            <div>
                                <label class="lbl">Currency</label>
                                <input class="input" type="text" th:field="*{currency}" placeholder="Currency"/>
                            </div>

                            <div>
                                <label class="lbl">Checked In</label>
                                <select class="input" th:field="*{checkedIn}">
                                    <option value="">All</option>
                                    <option value="true">Yes</option>
                                    <option value="false">No</option>
                                </select>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/passengers(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
