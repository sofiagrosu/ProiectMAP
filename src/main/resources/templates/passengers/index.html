<h1>Passengers</h1>
<a th:href="@{/passengers/new}">Add New Passenger</a>
<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Currency</th>
        <th>Checked In</th>
        <th>Actions</th>
    </tr>
    <tr th:each="p : ${passengers}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.currency}"></td>
        <td th:text="${p.checkedIn}"></td>
        <td>
            <a th:href="@{/passengers/edit/{id}(id=${p.id})}">Edit</a>
            <a th:href="@{/passengers/delete/{id}(id=${p.id})}">Delete</a>
            <a th:href="@{/passengers/details/{id}(id=${p.id})}">Details</a>
        </td>
    </tr>
</table>
