<h1 th:text="${passenger.id == null} ? 'Add Passenger' : 'Edit Passenger'"></h1>
<form th:action="@{/passengers/save}" th:object="${passenger}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" />
    <p th:errors="*{name}"></p>

    <label>Currency:</label>
    <input type="text" th:field="*{currency}" />
    <p th:errors="*{currency}"></p>

    <label>Checked In:</label>
    <input type="checkbox" th:field="*{checkedIn}" />

    <button type="submit">Save</button>
</form>
