<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tickets</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>Tickets</h1>
<a href="/tickets/new">Add Ticket</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Passenger</th>
        <th>Flight</th>
        <th>Seat</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tickets}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.passenger != null ? t.passenger.name : 'No Passenger'}"></td>
        <td th:text="${t.flight != null ? t.flight.name : 'No Flight'}"></td>
        <td th:text="${t.seatNumber}"></td>
        <td th:text="${t.price}"></td>
        <td>
            <a th:href="@{'/tickets/edit/' + ${t.id}}">Edit</a> |
            <a th:href="@{'/tickets/delete/' + ${t.id}}">Delete</a> |
            <a th:href="@{'/tickets/details/' + ${t.id}}">Details</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
