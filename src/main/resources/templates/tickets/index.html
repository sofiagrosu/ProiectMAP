<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Tickets</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">Tickets</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/tickets/new}">
                        Create New Ticket
                    </a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Passenger ID</th>
                        <th>Flight ID</th>
                        <th>Price</th>
                        <th>Seat Number</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="t : ${tickets}">
                        <td th:text="${t.id}"></td>
                        <td th:text="${t.passenger != null ? t.passenger.id : '-'}"></td>
                        <td th:text="${t.flight != null ? t.flight.id : '-'}"></td>
                        <td th:text="${t.price}"></td>
                        <td th:text="${t.seatNumber}"></td>

                        <td>
                            <a class="link" th:href="@{/tickets/details/{id}(id=${t.id})}">
                                Details
                            </a>
                        </td>
                        <td>
                            <a class="link" th:href="@{/tickets/edit/{id}(id=${t.id})}">
                                Edit
                            </a>
                        </td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/tickets/delete/{id}(id=${t.id})}"
                               onclick="return confirm('Are you sure you want to delete this ticket?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="8" class="empty">No tickets found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/tickets(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           passengerId=${filter.passengerId},
                           flightId=${filter.flightId},
                           priceMin=${filter.priceMin},
                           priceMax=${filter.priceMax},
                           seatNumber=${filter.seatNumber}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/tickets(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           passengerId=${filter.passengerId},
                           flightId=${filter.flightId},
                           priceMin=${filter.priceMin},
                           priceMax=${filter.priceMax},
                           seatNumber=${filter.seatNumber}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/tickets}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="passengerId" th:value="${filter.passengerId}"/>
                            <input type="hidden" name="flightId" th:value="${filter.flightId}"/>
                            <input type="hidden" name="priceMin" th:value="${filter.priceMin}"/>
                            <input type="hidden" name="priceMax" th:value="${filter.priceMax}"/>
                            <input type="hidden" name="seatNumber" th:value="${filter.seatNumber}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="passenger" th:selected="${sortBy == 'passenger'}">Passenger ID</option>
                                <option value="flight" th:selected="${sortBy == 'flight'}">Flight ID</option>
                                <option value="price" th:selected="${sortBy == 'price'}">Price</option>
                                <option value="seatNumber" th:selected="${sortBy == 'seatNumber'}">Seat Number</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/tickets}" method="get"
                              th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Passenger ID</label>
                                <input class="input" type="number"
                                       th:field="*{passengerId}" min="1" placeholder="e.g. 1"/>
                            </div>

                            <div>
                                <label class="lbl">Flight ID</label>
                                <input class="input" type="number"
                                       th:field="*{flightId}" min="1" placeholder="e.g. 2"/>
                            </div>

                            <div>
                                <label class="lbl">Price min</label>
                                <input class="input" type="number" step="0.01"
                                       th:field="*{priceMin}" min="0" placeholder="e.g. 100"/>
                            </div>

                            <div>
                                <label class="lbl">Price max</label>
                                <input class="input" type="number" step="0.01"
                                       th:field="*{priceMax}" min="0" placeholder="e.g. 500"/>
                            </div>

                            <div>
                                <label class="lbl">Seat Number</label>
                                <input class="input" type="text"
                                       th:field="*{seatNumber}" placeholder="e.g. 12A"/>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/tickets(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
