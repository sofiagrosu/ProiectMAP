<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket List</title>
</head>
<body>

<h2>Ticket List</h2>
<a th:href="@{/tickets/new}">Create New Ticket</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Passenger</th>
        <th>Price</th>
        <th>Seat</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.id}"></td>
        <td th:text="${ticket.flight.name}"></td>
        <td th:text="${ticket.passenger.name}"></td>
        <td th:text="${ticket.price}"></td>
        <td th:text="${ticket.seatNumber}"></td>
        <td>
            <a th:href="@{/tickets/details/{id}(id=${ticket.id})}">Details</a> |
            <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}">Edit</a> |
            <a th:href="@{/tickets/delete/{id}(id=${ticket.id})}" onclick="return confirm('Are you sure you want to delete this ticket?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
