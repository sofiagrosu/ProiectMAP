<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket List</title>
</head>
<body>

<h2>Ticket List</h2>
<a th:href="@{/tickets/new}">Create New Ticket</a>
<form th:action="@{/tickets}" method="get">
    <!-- resetăm pagina la 0 când schimbăm sortarea -->
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="price" th:selected="${sortBy == 'price'}">Price</option>
        <option value="seatNumber" th:selected="${sortBy == 'seatNumber'}">Seat Number</option>
        <option value="passenger" th:selected="${sortBy == 'passenger'}">Passenger</option>
        <option value="flight" th:selected="${sortBy == 'flight'}">Flight</option>
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true" th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Passenger</th>
        <th>Price</th>
        <th>Seat</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.id}"></td>
        <td th:text="${ticket.flight.name}"></td>
        <td th:text="${ticket.passenger.name}"></td>
        <td th:text="${ticket.price}"></td>
        <td th:text="${ticket.seatNumber}"></td>
        <td>
            <a th:href="@{/tickets/details/{id}(id=${ticket.id})}">Details</a> |
            <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}">Edit</a> |
            <a th:href="@{/tickets/delete/{id}(id=${ticket.id})}" onclick="return confirm('Are you sure you want to delete this ticket?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
