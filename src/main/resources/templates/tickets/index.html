<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tickets</title>
</head>
<body>

<h2>Tickets</h2>
<a th:href="@{/tickets/new}">Create New Ticket</a>

<hr/>

<!-- ===================== FILTER FORM ===================== -->
<h3>Filters</h3>
<form th:action="@{/tickets}" method="get" th:object="${filter}">

    <div>
        <label>Passenger ID</label>
        <input type="number" th:field="*{passengerId}" min="1" placeholder="e.g. 1"/>
    </div>

    <div>
        <label>Flight ID</label>
        <input type="number" th:field="*{flightId}" min="1" placeholder="e.g. 2"/>
    </div>

    <div>
        <label>Price min</label>
        <input type="number" step="0.01" th:field="*{priceMin}" min="0" placeholder="e.g. 100"/>
    </div>

    <div>
        <label>Price max</label>
        <input type="number" step="0.01" th:field="*{priceMax}" min="0" placeholder="e.g. 500"/>
    </div>

    <div>
        <label>Seat Number</label>
        <input type="text" th:field="*{seatNumber}" placeholder="e.g. 12A"/>
    </div>

    <!-- păstrăm sortarea -->
    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
    <input type="hidden" name="ascending" th:value="${ascending}"/>
    <input type="hidden" name="size" th:value="${page.size}"/>
    <input type="hidden" name="page" value="0"/>

    <button type="submit">Apply filters</button>

    <a th:href="@{/tickets(
            page=0,
            size=${page.size},
            sortBy=${sortBy},
            ascending=${ascending}
        )}">
        Reset filters
    </a>
</form>

<hr/>

<!-- ===================== SORT FORM ===================== -->
<h3>Sort</h3>
<form th:action="@{/tickets}" method="get">

    <!-- păstrăm filtrele -->
    <input type="hidden" name="passengerId" th:value="${filter.passengerId}"/>
    <input type="hidden" name="flightId" th:value="${filter.flightId}"/>
    <input type="hidden" name="priceMin" th:value="${filter.priceMin}"/>
    <input type="hidden" name="priceMax" th:value="${filter.priceMax}"/>
    <input type="hidden" name="seatNumber" th:value="${filter.seatNumber}"/>

    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>

    <label>Sort by:</label>
    <select name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="passenger" th:selected="${sortBy == 'passenger'}">Passenger ID</option>
        <option value="flight" th:selected="${sortBy == 'flight'}">Flight ID</option>
        <option value="price" th:selected="${sortBy == 'price'}">Price</option>
        <option value="seatNumber" th:selected="${sortBy == 'seatNumber'}">Seat Number</option>
    </select>

    <label>Direction:</label>
    <select name="ascending">
        <option value="true" th:selected="${ascending}">Ascending</option>
        <option value="false" th:selected="${!ascending}">Descending</option>
    </select>

    <button type="submit">Apply sort</button>
</form>

<hr/>

<!-- ===================== TABLE ===================== -->
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Passenger ID</th>
        <th>Flight ID</th>
        <th>Price</th>
        <th>Seat Number</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="t : ${tickets}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.passenger != null ? t.passenger.id : '-'}"></td>
        <td th:text="${t.flight != null ? t.flight.id : '-'}"></td>
        <td th:text="${t.price}"></td>
        <td th:text="${t.seatNumber}"></td>
        <td>
            <a th:href="@{/tickets/details/{id}(id=${t.id})}">Details</a> |
            <a th:href="@{/tickets/edit/{id}(id=${t.id})}">Edit</a> |
            <a th:href="@{/tickets/delete/{id}(id=${t.id})}"
               onclick="return confirm('Are you sure you want to delete this ticket?');">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ===================== PAGINATION ===================== -->
<div>
    <a th:if="${page.hasPrevious()}"
       th:href="@{/tickets(
           page=${page.number - 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           passengerId=${filter.passengerId},
           flightId=${filter.flightId},
           priceMin=${filter.priceMin},
           priceMax=${filter.priceMax},
           seatNumber=${filter.seatNumber}
       )}">
        Prev
    </a>

    <span th:text="${page.number + 1}"></span>
    /
    <span th:text="${page.totalPages}"></span>

    <a th:if="${page.hasNext()}"
       th:href="@{/tickets(
           page=${page.number + 1},
           size=${page.size},
           sortBy=${sortBy},
           ascending=${ascending},
           passengerId=${filter.passengerId},
           flightId=${filter.flightId},
           priceMin=${filter.priceMin},
           priceMax=${filter.priceMax},
           seatNumber=${filter.seatNumber}
       )}">
        Next
    </a>
</div>

</body>
</html>
