<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ticket Form</title>
</head>
<body>
<h1 th:text="${ticket.id == null} ? 'Create Ticket' : 'Edit Ticket'"></h1>

<form th:action="@{/tickets}" th:object="${ticket}" method="post">

    <label>Price</label>
    <input type="number" step="0.01" th:field="*{price}"/>

    <label>Seat</label>
    <input type="text" th:field="*{seatNumber}"/>

    <label>Passenger</label>
    <select th:field="*{passenger.id}">
        <option th:each="p : ${passengers}"
                th:value="${p.id}"
                th:text="${p.name}">
        </option>
    </select>

    <label>Flight</label>
    <select th:field="*{flight.id}">
        <option th:each="f : ${flights}"
                th:value="${f.id}"
                th:text="${f.name}">
        </option>
    </select>

    <button type="submit">Save</button>
</form>


</body>
</html>
