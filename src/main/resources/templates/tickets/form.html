<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Form</title>
</head>
<body>
<h1 th:text="${ticket.id != null ? 'Edit Ticket' : 'New Ticket'}"></h1>

<form th:action="@{/tickets/save}" th:object="${ticket}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <label>Passenger:</label>
    <select name="passengerId">
        <option th:each="p : ${passengers}" th:value="${p.id}" th:text="${p.name}"
                th:selected="${ticket.passenger != null && ticket.passenger.id == p.id}"></option>
    </select><br/>

    <label>Flight:</label>
    <select name="flightId">
        <option th:each="f : ${flights}" th:value="${f.id}" th:text="${f.name}"
                th:selected="${ticket.flight != null && ticket.flight.id == f.id}"></option>
    </select><br/>

    <label>Seat Number:</label>
    <input type="text" th:field="*{seatNumber}"/><br/>

    <label>Price:</label>
    <input type="number" th:field="*{price}" step="0.01"/><br/>

    <button type="submit">Save</button>
</form>

<a href="/tickets">Back to list</a>
</body>
</html>
