<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Details</title>
</head>
<body>

<h2>Ticket Details: <span th:text="${ticket.id}"></span></h2>

<p><strong>Pasager:</strong> <a th:href="@{/passengers/details/{id}(id=${ticket.passenger.id})}" th:text="${ticket.passenger.name}"></a></p>
<p><strong>Zbor:</strong> <a th:href="@{/flights/details/{id}(id=${ticket.flight.id})}" th:text="${ticket.flight.name}"></a></p>
<p><strong>Preț:</strong> <span th:text="${ticket.price}"></span></p>
<p><strong>Loc:</strong> <span th:text="${ticket.seatNumber}"></span></p>

<hr/>

<h3>Associated Luggage</h3>
<a th:href="@{/luggages/new?ticketId={id}(id=${ticket.id})}">Add a new Luggage</a>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="luggage : ${ticket.luggages}">
        <td th:text="${luggage.id}"></td>
        <td th:text="${luggage.status}"></td>
        <td><a th:href="@{/luggages/details/{id}(id=${luggage.id})}">Details</a></td>
    </tr>
    </tbody>
</table>

<hr/>
<a th:href="@{/tickets}">Back to List</a>

</body>
</html>
