<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notice Board List</title>
</head>
<body>

<h2>Notice Board List</h2>
<a th:href="@{/noticeboards/new}">Create New Notice Board</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="nb : ${noticeboards}">
        <td th:text="${nb.id}"></td>
        <td th:text="${nb.date}"></td>
        <td>
            <a th:href="@{/noticeboards/details/{id}(id=${nb.id})}">Details</a> |
            <a th:href="@{/noticeboards/edit/{id}(id=${nb.id})}">Edit</a> |
            <a th:href="@{/noticeboards/delete/{id}(id=${nb.id})}" onclick="return confirm('Are you sure you want to delete this notice board?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
