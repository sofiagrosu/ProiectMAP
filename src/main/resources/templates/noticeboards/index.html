<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>NoticeBoards</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="list-page">
<div class="page">
    <div class="panel">

        <div class="pill-title">NoticeBoards</div>

        <div class="content-grid">

            <!-- LEFT: Table -->
            <div class="table-area">

                <div class="top-actions">
                    <a class="btn btn-primary" th:href="@{/noticeboards/new}">
                        Create New NoticeBoard
                    </a>
                </div>

                <table class="fms-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <!-- IMPORTANT: controller-ul trimite "noticeBoards" -->
                    <tr th:each="nb : ${noticeBoards}">
                        <td th:text="${nb.id}"></td>
                        <td th:text="${nb.date}"></td>

                        <td>
                            <a class="link"
                               th:href="@{/noticeboards/details/{id}(id=${nb.id})}">
                                Details
                            </a>
                        </td>
                        <td>
                            <a class="link"
                               th:href="@{/noticeboards/edit/{id}(id=${nb.id})}">
                                Edit
                            </a>
                        </td>
                        <td>
                            <a class="link link-danger"
                               th:href="@{/noticeboards/delete/{id}(id=${nb.id})}"
                               onclick="return confirm('Are you sure you want to delete this noticeboard?');">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(noticeBoards)}">
                        <td colspan="5" class="empty">No noticeboards found.</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination (keeps filter + sort) -->
                <div class="pagination">
                    <a class="link" th:if="${page.hasPrevious()}"
                       th:href="@{/noticeboards(
                           page=${page.number - 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           dateFrom=${filter.dateFrom},
                           dateTo=${filter.dateTo}
                       )}">
                        Prev
                    </a>

                    <span class="pageinfo">
                        <span th:text="${page.number + 1}"></span> /
                        <span th:text="${page.totalPages}"></span>
                    </span>

                    <a class="link" th:if="${page.hasNext()}"
                       th:href="@{/noticeboards(
                           page=${page.number + 1},
                           size=${page.size},
                           sortBy=${sortBy},
                           ascending=${ascending},
                           dateFrom=${filter.dateFrom},
                           dateTo=${filter.dateTo}
                       )}">
                        Next
                    </a>
                </div>

                <div class="bottom-left">
                    <a class="btn btn-back" href="/">Back</a>
                </div>
            </div>

            <!-- RIGHT: Sort + Filter -->
            <div class="side-area">

                <!-- SORT PANEL -->
                <div class="side-block">
                    <div class="side-header">SORT</div>
                    <div class="side-body">

                        <form th:action="@{/noticeboards}" method="get" class="form-stack">
                            <!-- keep filters -->
                            <input type="hidden" name="dateFrom" th:value="${filter.dateFrom}"/>
                            <input type="hidden" name="dateTo" th:value="${filter.dateTo}"/>

                            <input type="hidden" name="page" value="0"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>

                            <label class="lbl">Sort by</label>
                            <select class="input" name="sortBy">
                                <option value="id" th:selected="${sortBy == 'id'}">ID</option>
                                <option value="date" th:selected="${sortBy == 'date'}">Date</option>
                            </select>

                            <label class="lbl">Direction</label>
                            <select class="input" name="ascending">
                                <option value="true" th:selected="${ascending}">Ascending</option>
                                <option value="false" th:selected="${!ascending}">Descending</option>
                            </select>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- FILTER PANEL -->
                <div class="side-block">
                    <div class="side-header">Filter</div>
                    <div class="side-body">

                        <form th:action="@{/noticeboards}" method="get"
                              th:object="${filter}" class="form-stack">

                            <div>
                                <label class="lbl">Date from</label>
                                <input class="input" type="date" th:field="*{dateFrom}"/>
                            </div>

                            <div>
                                <label class="lbl">Date to</label>
                                <input class="input" type="date" th:field="*{dateTo}"/>
                            </div>

                            <!-- keep sort -->
                            <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                            <input type="hidden" name="ascending" th:value="${ascending}"/>
                            <input type="hidden" name="size" th:value="${page.size}"/>
                            <input type="hidden" name="page" value="0"/>

                            <div class="side-actions">
                                <button class="btn btn-small" type="submit">Apply</button>

                                <a class="btn btn-small btn-secondary"
                                   th:href="@{/noticeboards(page=0, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
                                    Reset
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
