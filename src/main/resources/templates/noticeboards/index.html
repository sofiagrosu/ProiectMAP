<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notice Board List</title>
</head>
<body>

<h2>Notice Board List</h2>
<a th:href="@{/noticeboards/new}">Create New Notice Board</a>
<form th:action="@{/noticeboards}" method="get">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page != null ? page.size : 20}"/>

    <label for="sortBy">Sort by:</label>
    <select id="sortBy" name="sortBy">
        <option value="id" th:selected="${sortBy == 'id'}">ID</option>
        <option value="date" th:selected="${sortBy == 'date'}">Date</option>
    </select>

    <label for="ascending">Order:</label>
    <select id="ascending" name="ascending">
        <option value="true" th:selected="${ascending == true}">Ascending</option>
        <option value="false" th:selected="${ascending == false}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<hr/>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Flights of the day</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="nb : ${noticeBoards}">
        <td th:text="${nb.id}"></td>
        <td th:text="${nb.date}"></td>

        <!-- numărul de zboruri din board -->
        <td th:text="${nb.flightsOfTheDay != null ? nb.flightsOfTheDay.size() : 0}"></td>

        <td>
            <a th:href="@{/noticeboards/details/{id}(id=${nb.id})}">Details</a> |
            <a th:href="@{/noticeboards/edit/{id}(id=${nb.id})}">Edit</a> |
            <a th:href="@{/noticeboards/delete/{id}(id=${nb.id})}"
               onclick="return confirm('Delete this notice board?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- PAGINARE -->
<div th:if="${page != null}">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/noticeboards(page=${page.number - 1}, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
        Prev
    </a>

    <span th:text="${page.number + 1}"></span> /
    <span th:text="${page.totalPages}"></span>

    <a th:if="${page.hasNext()}"
       th:href="@{/noticeboards(page=${page.number + 1}, size=${page.size}, sortBy=${sortBy}, ascending=${ascending})}">
        Next
    </a>
</div>


</body>
</html>
