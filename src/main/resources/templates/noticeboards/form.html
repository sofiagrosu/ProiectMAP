<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notice Board Form</title>
    <style> .error { color: red; } </style>
</head>
<body>

<h2><span th:text="${noticeBoard.id} ? 'Edit Notice Board' : 'Create New Notice Board'"></span></h2>

<form th:action="@{/noticeboards/save}" th:object="${noticeBoard}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="date">Date:</label>
        <input type="date" id="date" th:field="*{date}" />
        <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Date Error</span>
    </div>
    <br/>

    <button type="submit">Save</button>
    <a th:href="@{/noticeboards}">Cancel</a>
</form>
</body>
</html>
